<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiniciar competició</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #121212; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; }</style>
</head>
<body>
    <div class="card bg-dark text-white shadow" style="width: 380px;">
        <div class="card-body text-center">
            <h3 class="mb-3 text-danger">⚠ REINICIAR SISTEMA</h3>
            <p class="small text-white-50">
                Esborra <b>totes</b> les baixades, sancions, puntuacions d'estètica i inspeccions,
                i posa a zero l'ordre de sortida i l'estat de la pista. Les penyes es conserven.
                <br>Només per a administradors.
            </p>
            <input id="confirm" class="form-control text-center mb-3" placeholder='Escriu REINICIAR per confirmar' autocomplete="off">
            <button id="btn" class="btn btn-danger w-100 fw-bold" disabled>REINICIAR</button>
            <div id="out" class="mt-3"></div>
            <a href="/" class="d-block mt-3 text-white-50 small">← Tornar al panell</a>
        </div>
    </div>
<script>
const confirmInput = document.getElementById('confirm');
const btn = document.getElementById('btn');
const out = document.getElementById('out');

confirmInput.addEventListener('input', () => { btn.disabled = confirmInput.value.trim() !== 'REINICIAR'; });

btn.addEventListener('click', async () => {
    btn.disabled = true;
    out.innerHTML = '';
    try {
        const res = await fetch('/api?action=resetSistema', { method: 'POST', credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) {
            out.innerHTML = '<div class="text-success fw-bold">SISTEMA REINICIAT AMB ÈXIT</div><div class="small text-white-50">La base de dades està neta i llista per a una nova competició.</div>';
            confirmInput.value = '';
        } else {
            out.innerHTML = '<div class="text-danger fw-bold">ERROR</div><div class="small">' + (data.error || 'No s\'ha pogut reiniciar') + '</div>';
            btn.disabled = false;
        }
    } catch (e) {
        out.innerHTML = '<div class="text-danger">Error de xarxa</div>';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
