<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accés Baixada</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="card bg-dark text-white shadow" style="width: 300px;">
        <div class="card-body text-center">
            <h3 class="mb-4">CODI D'ACCÉS</h3>
            <form id="loginForm">
                <input type="password" id="code" class="form-control form-control-lg mb-3 text-center"
                       inputmode="numeric" autofocus autocomplete="off">
                <div id="err" class="text-danger small mb-2" style="display:none"></div>
                <button type="submit" id="btn" class="btn btn-warning w-100 fw-bold">ENTRAR</button>
            </form>
        </div>
    </div>
<script>
const form = document.getElementById('loginForm');
const err  = document.getElementById('err');
const btn  = document.getElementById('btn');
const input = document.getElementById('code');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    try {
        const res = await fetch('/api?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ code: input.value })
        });
        const data = await res.json();
        if (data.success) { location.href = data.redirect || '/'; return; }
        err.textContent = data.error || 'No s\'ha pogut entrar';
    } catch (_) {
        err.textContent = 'Error de xarxa';
    }
    err.style.display = 'block';
    input.value = '';
    input.focus();
    btn.disabled = false;
});
</script>
</body>
</html>
