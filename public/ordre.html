<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carretons - Ordre</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; overscroll-behavior-y: contain; font-family: 'Futura', 'Trebuchet MS', Arial, sans-serif; }
        body.pending { visibility: hidden; }
        .navbar-brand { letter-spacing: 1px; }
        .card-menu { transition: transform 0.2s; cursor: pointer; text-decoration: none; color: inherit; border: none; }
        .card-menu:active { transform: scale(0.95); }

        /* Colors Custom Admin i Sincronització */
        .bg-indigo { background-color: #6610f2 !important; color: white; }
        .bg-teal { background-color: #20c997 !important; color: white; }
        .bg-slate { background-color: #6c757d !important; color: white; }
        .bg-orange { background-color: #fd7e14 !important; color: white; }

        .text-indigo { color: #6610f2 !important; }
        .text-teal { color: #20c997 !important; }
        .text-slate { color: #6c757d !important; }
        .text-orange { color: #fd7e14 !important; }

        .nav-link { font-size: 0.85rem; font-weight: 700 !important; display: flex; align-items: center; gap: 5px; }
        .nav-link i { font-size: 1.1rem; }

        /* Ajustos icones Dashboard */
        .card-menu i { font-size: 3.5rem; margin-bottom: 0.5rem; }
</style>

    <script src="/js/common.js"></script>
</head>
<body class="pending">

<div id="nav-root"></div>

<div class="container-fluid pb-5">
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold"><i class="bi bi-list-ol text-primary"></i> Ordre de Baixada</h1>
            <p class="text-muted">Llistat oficial per ordre de sorteig</p>
        </div>

        <div class="card shadow border-0 overflow-hidden">
            <div id="llistaOrdrePublic" class="list-group list-group-flush">
                </div>
        </div>
        
        <div class="text-center mt-4">
            <button class="btn btn-outline-secondary btn-sm" onclick="carregarOrdre()">
                <i class="bi bi-arrow-clockwise"></i> Actualitzar llista
            </button>
        </div>
    </div>
</div>

<script>
async function carregarOrdre() {
    const data = await apiCall('getOrdreSortida');
    const container = document.getElementById('llistaOrdrePublic');
    
    if(!data || data.length === 0) {
        container.innerHTML = '<div class="p-5 text-center text-muted fs-4">L\'ordre encara no ha estat generat per la comissió de carretons.</div>';
        return;
    }

    container.innerHTML = data.map(p => {
        // p.ja_baixat vindrà del nou cas de l'API
        const fet = p.ja_baixat > 0;
        return `
        <div class="list-group-item d-flex align-items-center py-4 ${fet ? 'bg-light' : ''}">
            <div class="me-4 text-center">
                <span class="badge ${fet ? 'bg-secondary' : 'bg-primary'} rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 50px; height: 50px; font-size: 1.5rem;">
                    ${p.ordre_sortida}
                </span>
            </div>
            <div class="flex-grow-1">
                <div class="fw-bold fs-3 ${fet ? 'text-muted text-decoration-line-through' : ''}">
                    ${p.nom}
                </div>
                ${fet ? '<span class="badge bg-success">COMPLETAT ✅</span>' : '<span class="text-primary fw-bold small">PENDENT</span>'}
            </div>
        </div>
    `}).join('');
}
document.addEventListener('DOMContentLoaded', carregarOrdre);
setInterval(carregarOrdre, 5000); // Polling cada 5 segons per seguir el live
</script>


</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
  <div id="liveToast" class="toast hide shadow-lg" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-bold" id="toastMsg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<script src="/js/shell.js"></script>

</body>
</html>
