<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carretons - Estetica</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; overscroll-behavior-y: contain; font-family: 'Futura', 'Trebuchet MS', Arial, sans-serif; }
        body.pending { visibility: hidden; }
        .navbar-brand { letter-spacing: 1px; }
        .card-menu { transition: transform 0.2s; cursor: pointer; text-decoration: none; color: inherit; border: none; }
        .card-menu:active { transform: scale(0.95); }

        /* Colors Custom Admin i Sincronització */
        .bg-indigo { background-color: #6610f2 !important; color: white; }
        .bg-teal { background-color: #20c997 !important; color: white; }
        .bg-slate { background-color: #6c757d !important; color: white; }
        .bg-orange { background-color: #fd7e14 !important; color: white; }

        .text-indigo { color: #6610f2 !important; }
        .text-teal { color: #20c997 !important; }
        .text-slate { color: #6c757d !important; }
        .text-orange { color: #fd7e14 !important; }

        .nav-link { font-size: 0.85rem; font-weight: 700 !important; display: flex; align-items: center; gap: 5px; }
        .nav-link i { font-size: 1.1rem; }

        /* Ajustos icones Dashboard */
        .card-menu i { font-size: 3.5rem; margin-bottom: 0.5rem; }
</style>

    <script src="/js/common.js"></script>
</head>
<body class="pending">

<div id="nav-root"></div>

<div class="container-fluid pb-5">
<div class="row">
    <div class="col-12 mb-4 text-center">
        <h2 class="fw-bold"><i class="fa-solid fa-palette text-warning"></i> Jurat d'Estètica</h2>
        <div class="card shadow-sm mt-3 border-0">
            <div class="card-body bg-dark text-white rounded-3">
                <label class="form-label fw-bold small text-uppercase text-secondary">Selecciona el teu perfil:</label>
                <select id="juratId" class="form-select form-select-lg mb-0 text-center fw-bold text-primary border-0" onchange="loadPenyesVotar()">
                    <option value="1">EVA</option>
                    <option value="2">MARTINA</option>
                    <option value="3">GERARD</option>
                    <option value="4">VÍCTOR (PÚBLIC)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="col-12" id="llistaJurat"></div>
</div>

<!-- MODAL DE VOTACIÓ -->
<div class="modal fade" id="votarModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-md-down">
    <div class="modal-content border-0">

      <div class="modal-header bg-warning text-dark shadow-sm">
        <div>
          <h5 class="modal-title fw-bold mb-0" id="nomPenyaVotar">Votar Penya</h5>
          <small class="text-muted">Puntuació estètica del carretó</small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body bg-light d-flex flex-column align-items-center justify-content-center py-5">
        <input type="hidden" id="votarPenyaId">

        <p class="text-muted small text-uppercase fw-bold mb-3 letter-spacing-1">Nota global (0 – 10)</p>

        <!-- Display gran de la nota -->
        <div id="notaDisplay" class="display-1 fw-bold text-dark mb-2"
             style="font-family:'Courier New',monospace; min-width:90px; text-align:center; line-height:1;">
          5
        </div>
        <div id="notaLabel" class="badge fs-6 mb-4 px-4 py-2" style="background:#6c757d;">Regular</div>

        <!-- Slider principal -->
        <div class="w-100 px-3">
          <input type="range" class="form-range form-range-lg" id="r_nota"
                 min="0" max="10" step="0.5" value="5"
                 oninput="actualitzaNota(this.value)">
          <div class="d-flex justify-content-between text-muted small px-1 mt-1">
            <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>
          </div>
        </div>

        <!-- Botons ràpids -->
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(0)">0</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(1)">1</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(2)">2</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(3)">3</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(4)">4</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(5)">5</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(6)">6</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(7)">7</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(8)">8</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(9)">9</button>
          
          <button type="button"
                  class="btn btn-outline-secondary btn-sm px-3 fw-bold nota-rapida"
                  onclick="setNota(10)">10</button>
          
        </div>
      </div>

      <div class="modal-footer border-0 bg-light pb-4">
        <button type="button" id="btnEnviar"
                class="btn btn-warning btn-lg w-100 fw-bold py-3 shadow text-dark"
                onclick="enviarVots()">
          <i class="fa-solid fa-paper-plane me-2"></i> REGISTRAR PUNTUACIÓ
        </button>
      </div>

    </div>
  </div>
</div>

<script>
let votsModal = null;

document.addEventListener("DOMContentLoaded", function() {
    votsModal = new bootstrap.Modal(document.getElementById('votarModal'));
    loadPenyesVotar();
});

/* ── Helpers visuals del slider ── */
function actualitzaNota(val) {
    const v = parseFloat(val);
    document.getElementById('r_nota').value    = v;
    document.getElementById('notaDisplay').textContent = v % 1 === 0 ? v : v.toFixed(1);

    const etiquetes = [
        [0,   '#dc3545', 'Molt baix'],
        [2,   '#fd7e14', 'Baix'],
        [4,   '#ffc107', 'Regular'],
        [6,   '#20c997', 'Bé'],
        [8,   '#0d6efd', 'Molt bé'],
        [9.5, '#6f42c1', 'Excel·lent'],
    ];
    const [, color, text] = [...etiquetes].reverse().find(([t]) => v >= t);
    const lbl = document.getElementById('notaLabel');
    lbl.style.background = color;
    lbl.textContent = text;

    // Ressaltar botó ràpid actiu
    document.querySelectorAll('.nota-rapida').forEach(b => {
        b.classList.toggle('active', parseFloat(b.textContent) === Math.round(v));
        b.classList.toggle('btn-secondary', parseFloat(b.textContent) === Math.round(v));
        b.classList.toggle('btn-outline-secondary', parseFloat(b.textContent) !== Math.round(v));
    });
}

function setNota(val) {
    actualitzaNota(val);
}

/* ── Càrrega llista penyes ── */
async function loadPenyesVotar() {
    const jutgeId  = document.getElementById('juratId').value;
    const container = document.getElementById('llistaJurat');
    container.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-warning"></div></div>';

    try {
        const penyes = await apiCall('getPenyesEstetica&jutge_id=' + jutgeId);
        if (!penyes || penyes.error) throw new Error("Error en l'API");

        const votades  = penyes.filter(p => parseInt(p.ja_votada) > 0);
        const pendents = penyes.filter(p => parseInt(p.ja_votada) === 0);
        const total    = penyes.length;
        const pct      = total > 0 ? Math.round((votades.length / total) * 100) : 0;

        let html = `
          <div class="mb-3">
            <div class="d-flex justify-content-between small text-muted mb-1">
              <span>${votades.length} de ${total} votades</span>
              <span>${pct}%</span>
            </div>
            <div class="progress" style="height:8px;">
              <div class="progress-bar bg-warning" style="width:${pct}%"></div>
            </div>
          </div>`;

        if (pendents.length > 0) {
            html += '<div class="list-group shadow-sm border-0 mb-3">';
            pendents.forEach(p => {
                html += `
                <button class="list-group-item list-group-item-action py-4 d-flex justify-content-between align-items-center border-bottom"
                        onclick="obrirVotacio(${p.id}, '${p.nom.replace(/'/g, "\\'")}')">
                    <div>
                      <div class="fs-5 fw-bold text-dark">${p.nom}</div>
                      <div class="small text-muted">${p.nom_carreto || '—'}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-warning fs-5"></i>
                </button>`;
            });
            html += '</div>';
        }

        if (votades.length > 0) {
            html += `<p class="small text-muted fw-bold text-uppercase mt-3 mb-2">Ja votades</p>
                     <div class="list-group border-0">`;
            votades.forEach(p => {
                html += `
                <div class="list-group-item py-3 d-flex justify-content-between align-items-center bg-light border-light" style="opacity:.65;">
                    <span class="fw-bold text-muted text-decoration-line-through">${p.nom}</span>
                    <span class="badge bg-success rounded-pill px-3"><i class="fa-solid fa-check me-1"></i> VOTAT</span>
                </div>`;
            });
            html += '</div>';
        }

        if (pendents.length === 0 && votades.length > 0) {
            html += `<div class="alert alert-success mt-3 text-center fw-bold">
                       <i class="fa-solid fa-trophy me-2"></i> Totes les penyes votades!
                     </div>`;
        }

        container.innerHTML = html;

    } catch(e) {
        container.innerHTML = '<div class="alert alert-danger">Error connectant amb el servidor.</div>';
    }
}

/* ── Obrir modal ── */
function obrirVotacio(id, nom) {
    document.getElementById('votarPenyaId').value = id;
    document.getElementById('nomPenyaVotar').innerText = nom;
    actualitzaNota(5);
    document.getElementById('r_nota').value = 5;
    votsModal.show();
}

/* ── Enviar vot ── */
async function enviarVots() {
    const btn  = document.getElementById('btnEnviar');
    const nota = parseFloat(document.getElementById('r_nota').value);

    const payload = {
        jutge_id: document.getElementById('juratId').value,
        penya_id: document.getElementById('votarPenyaId').value,
        nota:     nota,
    };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> GUARDANT...';

    const res = await apiCall('submitEstetica', payload);

    if (res && res.success) {
        votsModal.hide();
        loadPenyesVotar();
        if (typeof showToast === 'function') showToast(`Nota ${nota} registrada!`, "success");
    } else {
        alert(res?.error || "Error desconegut");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> REGISTRAR PUNTUACIÓ';
    }
}
</script>

<style>
.nota-rapida { min-width: 42px; }
.nota-rapida.active { font-weight: 900 !important; }
.form-range-lg { height: 1.5rem; }
.form-range-lg::-webkit-slider-thumb { width: 28px; height: 28px; }
</style>


</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
  <div id="liveToast" class="toast hide shadow-lg" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-bold" id="toastMsg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<script src="/js/shell.js"></script>

</body>
</html>
